<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.json">
<title>FamiliAI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f4fb;color:#17131f;padding-bottom:82px}
header{padding:24px 18px 8px;display:flex;gap:12px;align-items:center}.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#ec4899);display:grid;place-items:center;color:white;font-size:30px}.brand{font-size:28px;font-weight:800}.tag{color:#716b78;font-size:14px}
main{padding:12px 16px;max-width:720px;margin:auto}.hero{background:linear-gradient(135deg,#7c3aed,#ec4899);color:white;border-radius:30px;padding:24px;margin:10px 0 18px;box-shadow:0 10px 28px #7c3aed25}.hero .small{opacity:.9}.hero .amount{font-size:46px;font-weight:850;margin:5px 0}.bar{height:14px;background:#ffffff45;border-radius:99px;overflow:hidden;margin:15px 0}.bar i{display:block;height:100%;background:white;border-radius:99px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border-radius:22px;padding:18px;box-shadow:0 5px 18px #2513330b;margin-bottom:12px}.big{font-size:28px;font-weight:800}.muted{color:#77717e}.section{font-size:25px;font-weight:800;margin:22px 2px 12px}.ai{border-left:5px solid #7c3aed}.btn{border:0;border-radius:15px;padding:13px 16px;background:#ede5ff;color:#6d28d9;font-weight:800;font-size:15px}.btn.primary{background:#7c3aed;color:white}.btn.danger{background:#fee2e2;color:#b91c1c}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.list{display:grid;gap:9px}.item{background:white;border-radius:17px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center}.pill{font-size:12px;padding:5px 9px;border-radius:99px;background:#f0eaff;color:#6d28d9}.input{width:100%;padding:13px;border:1px solid #ddd5e7;border-radius:13px;background:white;font-size:16px;margin:5px 0 9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee7f2;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav{border:0;background:none;color:#777;font-size:12px}.nav b{display:block;font-size:23px}.nav.active{color:#7c3aed;font-weight:800}.hidden{display:none}.chat{max-height:390px;overflow:auto;display:grid;gap:9px}.msg{padding:11px 13px;border-radius:16px;max-width:88%;line-height:1.35}.me{justify-self:end;background:#7c3aed;color:white}.bot{background:#f0eaff;color:#30243d}.progress{height:10px;background:#eee8f4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#7c3aed}.smalltext{font-size:13px}
</style>
</head>
<body>
<header><div class="logo">✦</div><div><div class="brand">FamiliAI</div><div class="tag">L’IA qui aide votre famille à mieux vivre avec son budget</div></div></header>
<main>
<section id="home"></section><section id="expenses" class="hidden"></section><section id="budget" class="hidden"></section><section id="groceries" class="hidden"></section><section id="goals" class="hidden"></section><section id="profile" class="hidden"></section>
</main>
<nav class="bottom">
<button class="nav active" data-page="home"><b>⌂</b>Accueil</button>
<button class="nav" data-page="expenses"><b>▣</b>Dépenses</button>
<button class="nav" data-page="budget"><b>◔</b>Budget</button>
<button class="nav" data-page="groceries"><b>🛒</b>Courses</button>
<button class="nav" data-page="goals"><b>⚑</b>Objectifs</button>
</nav>
<script>
const KEY="familiAI_v3";
let d=JSON.parse(localStorage.getItem(KEY)||"null")||{
 income:5500, fixed:1200,
 expenses:[
  {name:"Alimentation",amount:620,cat:"Courses"},{name:"Carburant",amount:260,cat:"Transport"},
  {name:"Électricité",amount:150,cat:"Maison"},{name:"Assurances",amount:180,cat:"Maison"},
  {name:"Loisirs",amount:210,cat:"Loisirs"},{name:"Divers",amount:1450,cat:"Autres"}
 ],
 groceries:[{name:"Lait",price:1.20},{name:"Pâtes",price:1.80},{name:"Café",price:6.50},{name:"Poulet",price:9.90},{name:"Fromage",price:5.20}],
 goals:[{name:"Épargne de sécurité",target:5000,saved:1200}],
 family:{adults:2,children:2}
};
function save(){localStorage.setItem(KEY,JSON.stringify(d));render()}
function totalExpenses(){return d.expenses.reduce((s,x)=>s+Number(x.amount),0)}
function available(){return d.income-totalExpenses()}
function forecast(){let day=new Date().getDate(),days=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();return Math.round(available()/day*days)}
function euro(n){return new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n)}
function aiAdvice(){
 const food=d.expenses.filter(x=>x.cat==="Courses").reduce((s,x)=>s+Number(x.amount),0);
 const transport=d.expenses.filter(x=>x.cat==="Transport").reduce((s,x)=>s+Number(x.amount),0);
 if(available()<0)return `⚠️ Votre budget est actuellement dépassé de ${euro(Math.abs(available()))}. Commencez par examiner les dépenses variables et les abonnements.`;
 if(food>d.income*.15)return `🛒 L’alimentation représente ${Math.round(food/d.income*100)} % de vos revenus. Un panier optimisé pourrait réduire certains achats sans toucher aux dépenses essentielles.`;
 if(transport>d.income*.1)return `🚗 Le transport représente ${Math.round(transport/d.income*100)} % de vos revenus. Vérifiez carburant, assurances et dépenses d'entretien.`;
 return `✨ Votre budget laisse ${euro(available())} disponibles. Votre prévision de fin de mois est ${euro(forecast())}.`;
}
function home(){
 const a=available(), used=Math.min(100,Math.max(0,totalExpenses()/d.income*100));
 return `<div class="hero"><div class="small">Budget disponible</div><div class="amount">${euro(a)}</div><div class="bar"><i style="width:${used}%"></i></div><div>Prévision fin de mois : <b>${forecast()>=0?"+":""}${euro(forecast())}</b></div></div>
 <div class="grid"><div class="card"><div class="big">${euro(totalExpenses())}</div><div class="muted">Dépensé ce mois</div></div><div class="card"><div class="big">${euro(Math.max(0,d.income-totalExpenses()-d.fixed))}</div><div class="muted">Marge après charges</div></div></div>
 <div class="section">✨ Conseil FamiliAI</div><div class="card ai"><div class="big" style="font-size:20px">🤖 Analyse de votre situation</div><p>${aiAdvice()}</p><button class="btn" onclick="go('budget')">Voir mon budget</button></div>
 <div class="section">🎯 Objectifs</div>${d.goals.map(g=>`<div class="card"><div class="row"><b>${g.name}</b><span>${euro(g.saved)} / ${euro(g.target)}</span></div><div class="progress" style="margin-top:10px"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div></div>`).join("")}`;
}
function expenses(){
 return `<div class="section">💳 Mes dépenses</div><div class="card"><input id="en" class="input" placeholder="Ex. Supermarché"><div class="two"><input id="ea" class="input" type="number" placeholder="Montant €"><select id="ec" class="input"><option>Courses</option><option>Transport</option><option>Maison</option><option>Loisirs</option><option>Autres</option></select></div><button class="btn primary" onclick="addExpense()">+ Ajouter</button></div>
 <div class="list">${d.expenses.map((x,i)=>`<div class="item"><div><b>${x.name}</b><div class="smalltext muted"><span class="pill">${x.cat}</span></div></div><div><b>${euro(x.amount)}</b> <button class="btn danger" onclick="delExpense(${i})">×</button></div></div>`).join("")}</div>`;
}
function budget(){
 const cats={};d.expenses.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+Number(x.amount));
 return `<div class="section">📊 Budget familial</div><div class="card"><div class="row"><span>Revenus</span><b>${euro(d.income)}</b></div><div class="row"><span>Charges fixes</span><b>${euro(d.fixed)}</b></div><div class="row"><span>Dépenses enregistrées</span><b>${euro(totalExpenses())}</b></div><hr><div class="row"><b>Disponible</b><b>${euro(available())}</b></div></div>
 <div class="card"><h3>Répartition</h3>${Object.entries(cats).map(([k,v])=>`<div style="margin:12px 0"><div class="row"><span>${k}</span><b>${euro(v)}</b></div><div class="progress"><i style="width:${Math.min(100,v/d.income*100)}%"></i></div></div>`).join("")}</div>
 <div class="card"><h3>⚙️ Paramètres budget</h3><label>Revenus mensuels<input id="inc" class="input" type="number" value="${d.income}"></label><label>Charges fixes<input id="fix" class="input" type="number" value="${d.fixed}"></label><button class="btn primary" onclick="updateBudget()">Enregistrer</button></div>`;
}
function groceries(){
 const sum=d.groceries.reduce((s,x)=>s+Number(x.price),0), suggested=Math.round(sum*.12);
 return `<div class="section">🛒 Courses intelligentes</div><div class="card"><div class="row"><span>Panier actuel</span><b>${euro(sum)}</b></div><p>FamiliAI estime jusqu’à <b>${euro(suggested)}</b> d’économie en ciblant les produits à marge de prix élevée.</p><button class="btn primary" onclick="optimize()">✨ Optimiser mon panier</button></div>
 <div class="card"><input id="gn" class="input" placeholder="Produit"><input id="gp" class="input" type="number" step=".01" placeholder="Prix €"><button class="btn" onclick="addGrocery()">+ Ajouter au panier</button></div>
 <div class="list">${d.groceries.map((x,i)=>`<div class="item"><span>${x.name}</span><b>${Number(x.price).toFixed(2)} € <button class="btn danger" onclick="delGrocery(${i})">×</button></b></div>`).join("")}</div>
 <div class="section">🤖 Conseiller FamiliAI</div><div class="card"><div id="chat" class="chat"><div class="msg bot">Bonjour ! Demandez-moi par exemple : « Est-ce que je peux me permettre une voiture à 350 € par mois ? »</div></div><div class="two" style="margin-top:10px"><input id="q" class="input" placeholder="Votre question…"><button class="btn primary" onclick="ask()">Demander</button></div></div>`;
}
function goals(){
 return `<div class="section">🎯 Mes objectifs</div><div class="card"><input id="gnm" class="input" placeholder="Nom de l'objectif"><div class="two"><input id="gt" class="input" type="number" placeholder="Objectif €"><input id="gs" class="input" type="number" placeholder="Déjà épargné €"></div><button class="btn primary" onclick="addGoal()">+ Créer</button></div>
 <div class="list">${d.goals.map((g,i)=>`<div class="card"><div class="row"><b>${g.name}</b><button class="btn danger" onclick="delGoal(${i})">×</button></div><p>${euro(g.saved)} / ${euro(g.target)}</p><div class="progress"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div><button class="btn" style="margin-top:10px" onclick="addSaving(${i})">+ Ajouter 50 €</button></div>`).join("")}</div>`;
}
function profile(){
 return `<div class="section">👨‍👩‍👧 Profil familial</div><div class="card"><label>Adultes<input id="ad" class="input" type="number" value="${d.family.adults}"></label><label>Enfants<input id="ch" class="input" type="number" value="${d.family.children}"></label><button class="btn primary" onclick="updateFamily()">Enregistrer</button><hr><p>FamiliAI utilise ces informations pour contextualiser les analyses et objectifs.</p><button class="btn danger" onclick="resetData()">Réinitialiser toutes les données</button></div>
 <div class="card"><h3>💬 Questions utiles</h3><p>« Combien puis-je épargner ce mois-ci ? »</p><p>« Puis-je ajouter 350 € de mensualité ? »</p><p>« Où réduire mes dépenses ? »</p></div>`;
}
function render(){
 document.getElementById("home").innerHTML=home();document.getElementById("expenses").innerHTML=expenses();document.getElementById("budget").innerHTML=budget();document.getElementById("groceries").innerHTML=groceries();document.getElementById("goals").innerHTML=goals();document.getElementById("profile").innerHTML=profile();
}
function go(p){document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));document.getElementById(p).classList.remove("hidden");document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===p));}
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>go(n.dataset.page));
function addExpense(){let n=en.value.trim(),a=+ea.value;if(n&&a>0){d.expenses.unshift({name:n,amount:a,cat:ec.value});save()}}
function delExpense(i){d.expenses.splice(i,1);save()}
function updateBudget(){d.income=+inc.value||0;d.fixed=+fix.value||0;save()}
function addGrocery(){let n=gn.value.trim(),p=+gp.value;if(n&&p>=0){d.groceries.push({name:n,price:p});save()}}
function delGrocery(i){d.groceries.splice(i,1);save()}
function optimize(){alert("✨ FamiliAI : pour ce panier, commencez par comparer les marques et formats des produits les plus chers. Économie indicative : 10 à 15 % du panier.")}
function addGoal(){let n=gnm.value.trim(),t=+gt.value,s=+gs.value||0;if(n&&t>0){d.goals.push({name:n,target:t,saved:s});save()}}
function delGoal(i){d.goals.splice(i,1);save()}
function addSaving(i){d.goals[i].saved+=50;save()}
function updateFamily(){d.family.adults=+ad.value||1;d.family.children=+ch.value||0;save()}
function resetData(){if(confirm("Réinitialiser toutes les données ?")){localStorage.removeItem(KEY);location.reload()}}
function ask(){
 let q=document.getElementById("q").value.trim();if(!q)return;let chat=document.getElementById("chat");chat.innerHTML+=`<div class="msg me">${q}</div>`;
 let ans="";let m=q.match(/(\d+)\s*€/);let extra=m?+m[1]:0;
 if(/voiture|mensualité|crédit/i.test(q)){let reste=available()-extra;ans=reste>=0?`Avec une mensualité supplémentaire de ${euro(extra)}, il resterait environ ${euro(reste)} selon les dépenses actuellement enregistrées. Il faut aussi tenir compte de l'assurance, carburant, entretien et des éventuelles variations de revenus.`:`Avec ${euro(extra)} de mensualité supplémentaire, le budget enregistré passerait à ${euro(reste)}. Il faudrait revoir les dépenses ou les revenus avant de considérer cette charge.`}
 else if(/épargn|mettre de côté/i.test(q)){ans=`Sur la base des données enregistrées, votre disponible actuel est de ${euro(available())}. Une réserve prudente peut être fixée après prise en compte des dépenses exceptionnelles et charges à venir.`}
 else if(/réduire|économ|où/i.test(q)){ans=aiAdvice()}
 else ans=`D’après vos données actuelles : revenus ${euro(d.income)}, dépenses ${euro(totalExpenses())}, disponible ${euro(available())}. Posez-moi une question sur une dépense, une mensualité, l’épargne ou les courses.`;
 chat.innerHTML+=`<div class="msg bot">${ans}</div>`;document.getElementById("q").value="";chat.scrollTop=chat.scrollHeight;
}
render();
</script>
</body></html>
